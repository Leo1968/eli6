<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELI6 可视化面板</title>
  <style>
    :root {
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    .header {
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }
    .input-row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--primary); }
    button.btn-submit {
      padding: 8px 16px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button.btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
    .status-bar {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 8px;
    }
    #statusText { margin-right: auto; }
    .viewer-action {
      padding: 6px 10px;
      background: #ffffff;
      color: var(--primary);
      border: 1px solid #bfdbfe;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .viewer-action:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .viewer-container { flex: 1; position: relative; background: #ffffff; }
    iframe { width: 100%; height: 100%; border: none; }
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255, 255, 255, 0.9);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 14px;
      color: var(--muted);
      z-index: 10;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="input-row">
      <input type="text" id="customInput" placeholder="输入想图解的概念，或网页划词右键..." />
      <button class="btn-submit" id="btnRun">Lens</button>
    </div>
    <div class="status-bar">
      <span id="statusText">就绪</span>
      <button class="viewer-action" id="btnOpenPage" type="button" disabled>Open</button>
      <button class="viewer-action" id="btnDownload" type="button" disabled>Download</button>
    </div>
  </div>

  <div class="viewer-container">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner"></div>
      <div id="loadingText">正在生成可视化图解...</div>
    </div>
    <iframe id="renderFrame" sandbox="allow-scripts allow-downloads allow-same-origin"></iframe>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
